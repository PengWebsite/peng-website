<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>七夕｜999朵玫瑰花</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Microsoft Yahei", sans-serif;
            background: linear-gradient(180deg, #fff 0%, #fff8fa 30%, #fff0f4 60%, #ffe8ef 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ===== 动态背景光斑 ===== */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat ease-in-out infinite alternate;
        }
        .bg-orb:nth-child(1) { width: 50vmin; height: 50vmin; background: rgba(255,182,193,0.5); top: -10%; left: -10%; animation-duration: 10s; }
        .bg-orb:nth-child(2) { width: 40vmin; height: 40vmin; background: rgba(255,228,235,0.6); top: 15%; right: -8%; animation-duration: 13s; animation-delay: -3s; }
        .bg-orb:nth-child(3) { width: 35vmin; height: 35vmin; background: rgba(230,210,255,0.35); bottom: 5%; left: 5%; animation-duration: 9s; animation-delay: -5s; }
        .bg-orb:nth-child(4) { width: 30vmin; height: 30vmin; background: rgba(255,240,245,0.6); top: 35%; left: 35%; animation-duration: 11s; animation-delay: -2s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, -15px) scale(1.08); }
        }

        /* ===== 飘落花瓣粒子 ===== */
        .petal-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: petalDrift linear infinite;
            opacity: 0;
        }

        @keyframes petalDrift {
            0% { opacity: 0; transform: translateY(-20px) rotate(0deg) translateX(0); }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { opacity: 0; transform: translateY(100vh) rotate(360deg) translateX(30px); }
        }

        /* ===== 标题区域 ===== */
        .header {
            position: fixed;
            top: max(20px, 4vh);
            text-align: center;
            z-index: 100;
        }

        .title {
            color: #d63384;
            font-size: clamp(20px, 5vw, 32px);
            text-shadow: 0 2px 12px rgba(214,51,132,0.25);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .tip {
            color: #e075a0;
            font-size: clamp(13px, 3vw, 16px);
        }

        .tip span { font-weight: bold; color: #d63384; }

        /* 进度条 */
        .progress-wrap {
            width: min(200px, 50vw);
            height: 5px;
            background: rgba(255,182,193,0.3);
            border-radius: 3px;
            margin: 10px auto 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8fab, #d63384);
            border-radius: 3px;
            transition: width 0.15s;
        }

        /* ===== 花束主体 ===== */
        .bouquet-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: max(60px, 10vh);
            animation: bouquetBreath 4s ease-in-out infinite;
        }

        @keyframes bouquetBreath {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-4px); }
        }

        /* 花朵圆形区域 */
        .flower-ball {
            position: relative;
            width: min(260px, 65vw);
            height: min(260px, 65vw);
            border-radius: 50%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            /* 圆形渐变底色 */
            background: radial-gradient(circle at 40% 35%, rgba(255,100,130,0.08), rgba(200,30,60,0.05));
        }

        .flower-ball .rose-item {
            position: absolute;
            font-size: clamp(14px, 4vw, 22px);
            filter: drop-shadow(0 1px 3px rgba(180,20,50,0.2));
            animation: roseSway ease-in-out infinite alternate;
        }

        @keyframes roseSway {
            0% { transform: rotate(-3deg) scale(1); }
            100% { transform: rotate(3deg) scale(1.05); }
        }

        /* 绿叶层 */
        .leaves {
            position: relative;
            width: min(220px, 55vw);
            height: 40px;
            margin-top: -15px;
            display: flex;
            justify-content: center;
            gap: 2px;
            z-index: 2;
        }

        .leaf {
            width: clamp(20px, 5vw, 32px);
            height: clamp(30px, 7vw, 45px);
            background: linear-gradient(160deg, #4caf50, #2e7d32);
            border-radius: 50% 0 50% 0;
            transform-origin: bottom center;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1);
        }

        .leaf:nth-child(odd) { transform: rotate(-25deg); }
        .leaf:nth-child(even) { transform: rotate(25deg) scaleX(-1); }
        .leaf:nth-child(3) { transform: rotate(-10deg); }
        .leaf:nth-child(4) { transform: rotate(10deg) scaleX(-1); }
        .leaf:nth-child(5) { transform: rotate(0deg); }

        /* 包装纸 */
        .paper-wrap {
            position: relative;
            width: min(160px, 42vw);
            height: min(140px, 30vw);
            background: linear-gradient(170deg, #fff5f7, #ffe4ec, #ffd6e0);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            margin-top: -5px;
            box-shadow: 0 8px 25px rgba(214,51,132,0.12);
            border-radius: 0 0 8px 8px;
        }

        .paper-wrap::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 100%;
            background: linear-gradient(170deg, rgba(255,255,255,0.4), transparent);
            clip-path: polygon(20% 0%, 80% 0%, 90% 100%, 10% 100%);
        }

        /* 丝带蝴蝶结 */
        .bow {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 24px;
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            top: 4px;
            width: 18px;
            height: 14px;
            background: linear-gradient(135deg, #ff6b9d, #e91e63);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }

        .bow::before { left: 1px; transform: rotate(-15deg); }
        .bow::after { right: 1px; transform: rotate(15deg); }

        .bow .knot {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #d63384;
            border-radius: 50%;
        }

        /* ===== 飘落的玫瑰 ===== */
        .falling-rose {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            user-select: none;
            animation: roseFall linear forwards;
        }

        @keyframes roseFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            70% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(540deg) scale(0.6);
            }
        }

        /* ===== 底部文字 ===== */
        .end-text {
            position: fixed;
            bottom: max(15px, 3vh);
            width: 100%;
            text-align: center;
            color: #d63384;
            font-size: clamp(14px, 3.5vw, 20px);
            z-index: 100;
            opacity: 0;
            transition: opacity 2s ease;
            text-shadow: 0 1px 6px rgba(214,51,132,0.15);
        }

        .end-text.show { opacity: 1; }

        /* ===== 情侣+泰迪 ===== */
        .couple-section {
            position: fixed;
            bottom: max(40px, 6vh);
            right: max(10px, 3vw);
            z-index: 60;
            transform: scale(clamp(0.7, 2vw, 1));
            transform-origin: bottom right;
        }

        .couple-container {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            position: relative;
        }

        .heart-between {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            animation: heartBeat 1s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.35); }
        }

        /* 男生 */
        .boy { position: relative; width: 40px; height: 80px; animation: sway 3s ease-in-out infinite; }
        @keyframes sway { 0%,100%{transform:rotate(0)} 50%{transform:rotate(2deg)} }
        .boy .b-head { width: 20px; height: 20px; background: #ffcc80; border-radius: 50%; margin: 0 auto; position: relative; }
        .boy .b-hair { position: absolute; top: -2px; left: 2px; width: 16px; height: 10px; background: #3e2723; border-radius: 50% 50% 0 0; }
        .boy .b-body { width: 24px; height: 32px; background: linear-gradient(#1565c0,#0d47a1); margin: 2px auto 0; border-radius: 5px 5px 2px 2px; }
        .boy .b-legs { display: flex; justify-content: center; gap: 2px; }
        .boy .b-leg { width: 8px; height: 20px; background: #37474f; border-radius: 0 0 3px 3px; }

        /* 女生 */
        .girl { position: relative; width: 40px; height: 80px; animation: sway 3s ease-in-out infinite 0.5s; }
        .girl .g-head { width: 18px; height: 18px; background: #ffcc80; border-radius: 50%; margin: 0 auto; position: relative; }
        .girl .g-hair { position: absolute; top: -3px; left: -2px; width: 22px; height: 13px; background: #4e342e; border-radius: 50% 50% 30% 30%; }
        .girl .g-hair::after, .girl .g-hair::before { content:''; position:absolute; top:8px; width:5px; height:14px; background:#4e342e; border-radius:0 0 3px 3px; }
        .girl .g-hair::after { left: -1px; }
        .girl .g-hair::before { right: -1px; }
        .girl .g-dress { width: 26px; height: 32px; background: linear-gradient(#e91e63,#c2185b); margin: 2px auto 0; clip-path: polygon(25% 0%,75% 0%,100% 100%,0% 100%); }
        .girl .g-legs { display: flex; justify-content: center; gap: 2px; }
        .girl .g-leg { width: 7px; height: 16px; background: #ffcc80; border-radius: 0 0 3px 3px; }

        /* 泰迪 */
        .teddy { position: relative; width: 44px; height: 44px; margin-left: 6px; animation: bounce 1.4s ease-in-out infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
        .teddy .t-body { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:26px; height:22px; background:linear-gradient(135deg,#d4a574,#b8865a); border-radius:50% 50% 45% 45%; }
        .teddy .t-head { position:absolute; top:3px; left:50%; transform:translateX(-50%); width:22px; height:20px; background:linear-gradient(135deg,#d4a574,#c4956a); border-radius:50%; z-index:2; }
        .teddy .t-ear { position:absolute; top:0; width:9px; height:9px; background:#a0714a; border-radius:50%; z-index:1; }
        .teddy .t-ear.l { left: 9px; }
        .teddy .t-ear.r { right: 9px; }
        .teddy .t-eye { position:absolute; top:10px; width:3px; height:3px; background:#1a1a1a; border-radius:50%; z-index:3; animation: blink 3s infinite; }
        .teddy .t-eye.l { left: 14px; }
        .teddy .t-eye.r { right: 14px; }
        @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(0.1)} }
        .teddy .t-nose { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:4px; height:3px; background:#1a1a1a; border-radius:50%; z-index:3; }
        .teddy .t-tail { position:absolute; bottom:8px; right:4px; width:8px; height:8px; background:#d4a574; border-radius:50%; animation:wag .4s ease-in-out infinite alternate; transform-origin:left center; }
        @keyframes wag { from{transform:rotate(-20deg)} to{transform:rotate(20deg)} }

        /* ===== 完成弹窗 ===== */
        .complete-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .complete-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .complete-overlay .big-heart {
            font-size: 60px;
            animation: heartBeat 1s ease-in-out infinite;
        }

        .complete-overlay .msg {
            margin-top: 15px;
            font-size: clamp(18px, 5vw, 28px);
            color: #d63384;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <!-- 背景光斑 -->
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <!-- 标题 -->
    <div class="header">
        <div class="title">🌹 999朵玫瑰 · 七夕快乐 🌹</div>
        <div class="tip">已送出：<span id="num">0</span> / 999 朵</div>
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- 花束 -->
    <div class="bouquet-wrap">
        <div class="flower-ball" id="flowerBall"></div>
        <div class="leaves">
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
        </div>
        <div class="paper-wrap">
            <div class="bow"><div class="knot"></div></div>
        </div>
    </div>

    <!-- 底部文字 -->
    <div class="end-text" id="endText">💌 予你天长地久的偏爱，999朵玫瑰代表长长久久</div>

    <!-- 情侣+泰迪 -->
    <div class="couple-section">
        <div class="couple-container">
            <div class="heart-between">💗</div>
            <div class="boy">
                <div class="b-head"><div class="b-hair"></div></div>
                <div class="b-body"></div>
                <div class="b-legs"><div class="b-leg"></div><div class="b-leg"></div></div>
            </div>
            <div class="girl">
                <div class="g-head"><div class="g-hair"></div></div>
                <div class="g-dress"></div>
                <div class="g-legs"><div class="g-leg"></div><div class="g-leg"></div></div>
            </div>
            <div class="teddy">
                <div class="t-ear l"></div>
                <div class="t-ear r"></div>
                <div class="t-head">
                    <div class="t-eye l"></div>
                    <div class="t-eye r"></div>
                    <div class="t-nose"></div>
                </div>
                <div class="t-body"></div>
                <div class="t-tail"></div>
            </div>
        </div>
    </div>

    <!-- 完成遮罩 -->
    <div class="complete-overlay" id="completeOverlay">
        <div class="big-heart">💝</div>
        <div class="msg">999朵玫瑰已送达<br>愿你被这世界温柔以待<br>七夕快乐 ❤️</div>
    </div>

    <script>
        // ===== 花束圆形区域填充玫瑰 =====
        const flowerBall = document.getElementById('flowerBall');
        const ballSize = flowerBall.offsetWidth || 260;
        const roseCount = 80; // 花束上显示的花朵数量

        for (let i = 0; i < roseCount; i++) {
            const rose = document.createElement('span');
            rose.className = 'rose-item';
            rose.textContent = '🌹';

            // 在圆形内随机分布
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * (ballSize / 2 - 15);
            const x = ballSize / 2 + Math.cos(angle) * radius;
            const y = ballSize / 2 + Math.sin(angle) * radius;

            rose.style.left = x + 'px';
            rose.style.top = y + 'px';
            rose.style.animationDuration = (2 + Math.random() * 2) + 's';
            rose.style.animationDelay = Math.random() * 2 + 's';
            flowerBall.appendChild(rose);
        }

        // ===== 背景飘落花瓣粒子 =====
        const petalChars = ['🌸', '💮', '🩷', '✿'];
        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.className = 'petal-particle';
            p.textContent = petalChars[Math.floor(Math.random() * petalChars.length)];
            p.style.left = Math.random() * 100 + '%';
            p.style.fontSize = (8 + Math.random() * 10) + 'px';
            p.style.animationDuration = (8 + Math.random() * 10) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            document.body.appendChild(p);
        }

        // ===== 999朵玫瑰飘落 =====
        const countDom = document.getElementById('num');
        const progressBar = document.getElementById('progressBar');
        const endText = document.getElementById('endText');
        const completeOverlay = document.getElementById('completeOverlay');
        const maxRose = 999;
        let total = 0;

        function createFallingRose() {
            if (total >= maxRose) return;

            const el = document.createElement('div');
            el.className = 'falling-rose';
            el.textContent = '🌹';
            el.style.left = Math.random() * 95 + '%';
            el.style.top = '-40px';
            el.style.fontSize = (16 + Math.random() * 14) + 'px';

            const dur = 3 + Math.random() * 4;
            el.style.animationDuration = dur + 's';

            document.body.appendChild(el);
            total++;
            countDom.textContent = total;
            progressBar.style.width = (total / maxRose * 100) + '%';

            // 动画结束后移除DOM
            setTimeout(() => el.remove(), dur * 1000);

            // 完成
            if (total >= maxRose) {
                setTimeout(() => endText.classList.add('show'), 1000);
                setTimeout(() => completeOverlay.classList.add('show'), 3000);
            }
        }

        // 逐步加速生成
        let delay = 70;
        const timer = setInterval(() => {
            createFallingRose();
            if (total > 400) delay = 50;
            if (total > 700) delay = 35;
            if (total >= maxRose) clearInterval(timer);
        }, delay);
    </script>
</body>
</html>
