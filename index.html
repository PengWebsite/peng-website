<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>七夕｜999朵玫瑰花</title>
<link rel="stylesheet" href="Style.css">
</head>
<body>

<div class="bg-orb" style="width:45vmin;height:45vmin;background:rgba(255,182,193,.4);top:-8%;left:-8%"></div>
<div class="bg-orb" style="width:38vmin;height:38vmin;background:rgba(255,228,235,.5);top:12%;right:-6%;animation-delay:-3s"></div>
<div class="bg-orb" style="width:32vmin;height:32vmin;background:rgba(230,210,255,.3);bottom:8%;left:8%;animation-delay:-5s"></div>
<div class="bg-orb" style="width:28vmin;height:28vmin;background:rgba(255,240,245,.5);top:38%;left:38%;animation-delay:-2s"></div>

<div class="header">
  <div class="title">🌹 999朵玫瑰 · 七夕快乐 🌹</div>
  <div class="tip">已送出：<span id="num">0</span> / 999 朵</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="bouquet-wrap" id="bouquetWrap">
  <div class="flower-ball" id="flowerBall"></div>
  <div class="leaves">
    <div class="leaf small" style="transform:rotate(-40deg)"></div>
    <div class="leaf" style="transform:rotate(-28deg)"></div>
    <div class="leaf" style="transform:rotate(-16deg)"></div>
    <div class="leaf" style="transform:rotate(-5deg)"></div>
    <div class="leaf" style="transform:rotate(0deg)"></div>
    <div class="leaf" style="transform:rotate(5deg) scaleX(-1)"></div>
    <div class="leaf" style="transform:rotate(16deg) scaleX(-1)"></div>
    <div class="leaf" style="transform:rotate(28deg) scaleX(-1)"></div>
    <div class="leaf small" style="transform:rotate(40deg) scaleX(-1)"></div>
  </div>
  <div class="paper-wrap" id="paperWrap">
    <div class="bow">
      <div class="knot"></div>
      <div class="ribbon-l"></div>
      <div class="ribbon-r"></div>
    </div>
  </div>
</div>

<div class="end-text" id="endText"></div>

<div class="couple-section" id="coupleSection">
  <div class="couple-container">
    <div class="heart-between">💗</div>
    
    <div class="boy">
      <div class="b-head">
        <div class="b-hair"></div>
        <div class="b-eye-l"></div>
        <div class="b-eye-r"></div>
        <div class="b-mouth"></div>
      </div>
      <div class="b-body">
        <div class="b-arm-l"></div>
        <div class="b-arm-r"></div>
      </div>
      <div class="b-legs">
        <div class="b-leg"></div>
        <div class="b-leg"></div>
      </div>
    </div>

    <div class="girl">
      <div class="g-head">
        <div class="g-hair"></div>
        <div class="g-eye-l"></div>
        <div class="g-eye-r"></div>
        <div class="g-mouth"></div>
      </div>
      <div class="g-body">
        <div class="g-arm-l"></div>
        <div class="g-dress"></div>
        <div class="g-arm-r"></div>
      </div>
      <div class="g-legs">
        <div class="g-leg"></div>
        <div class="g-leg"></div>
      </div>
    </div>

    <div class="teddy">
      <div class="t-tail"></div>
      <div class="t-body"></div>
      <div class="t-head">
        <div class="t-ear-l"></div>
        <div class="t-ear-r"></div>
        <div class="t-eye-l"></div>
        <div class="t-eye-r"></div>
        <div class="t-nose"></div>
      </div>
    </div>
    
  </div>
</div>

<div class="complete-overlay" id="completeOverlay">
  <div class="big-heart" id="bigHeart">💝</div>
  <div class="msg" id="completeMsg">999朵玫瑰已送达<br>愿你被这世界温柔以待<br>七夕快乐 ❤️</div>
</div>

<!-- 请确保 jquery.min.js 文件与此 HTML 文件在同一目录下 -->
<script src="jquery.min.js"></script>
<script>
$(function(){
  var maxRose = 600, total = 0;
  var numEl = $('#num');
  var bar = $('#progressBar');
  
  $('.title').delay(200).animate({opacity: 1}, 600);
  $('.tip').delay(500).animate({opacity: 1}, 500);
  $('.progress-wrap').delay(700).animate({opacity: 1}, 500);
  $('#bouquetWrap').delay(400).animate({opacity: 1}, 800);
  $('#coupleSection').delay(1000).animate({opacity: 1}, 700);

  function buildFlowerBall() {
    var ball = $('#flowerBall')[0];
    var size = ball.offsetWidth || 250;
    var radius = size / 2;
    var ga = Math.PI * (3 - Math.sqrt(5));
    var pos = [];
    
    for (var i = 0; i < 120; i++) {
      var r = (radius - 6) * Math.sqrt(i / 120);
      var t = i * ga;
      pos.push({x: radius + r * Math.cos(t), y: radius + r * Math.sin(t), d: r});
    }
    for (var j = 0; j < 24; j++) {
      var a = (j / 24) * Math.PI * 2;
      pos.push({x: radius + (radius - 9) * Math.cos(a), y: radius + (radius - 9) * Math.sin(a), d: radius - 9});
    }
    for (var k = 0; k < 16; k++) {
      var a2 = (k / 16) * Math.PI * 2 + 0.3;
      pos.push({x: radius + (radius - 6) * 0.55 * Math.cos(a2), y: radius + (radius - 6) * 0.55 * Math.sin(a2), d: (radius - 6) * 0.55});
    }
    
    pos.sort(function(a, b) { return a.d - b.d; });
    var fs = Math.max(16, Math.floor(size / 10));
    var frag = document.createDocumentFragment();
    var els = [];
    
    pos.forEach(function(p) {
      var s = document.createElement('span');
      s.className = 'rose-item';
      s.textContent = '🌹';
      s.style.left = (p.x - fs / 2) + 'px';
      s.style.top = (p.y - fs / 2) + 'px';
      s.style.fontSize = fs + 'px';
      frag.appendChild(s);
      els.push(s);
    });
    
    ball.appendChild(frag);
    els.forEach(function(el, idx) {
      setTimeout(function() { el.classList.add('show'); }, 600 + idx * 60);
    });
    
    var done = 600 + els.length * 60 + 300;
    setTimeout(function() {
      $('.leaf').each(function(i) {
        var e = $(this);
        setTimeout(function() { e.addClass('show'); }, i * 70);
      });
    }, done);
    setTimeout(function() { $('#paperWrap').addClass('show'); }, done + 500);
  }
  
  buildFlowerBall();

  function createFallingRose() {
    if (total >= maxRose) return;
    var sz = 14 + Math.random() * 14;
    var sx = Math.random() * (window.innerWidth - 30);
    var dur = 2 + Math.random() * 1.5;
    
    var el = $('<div class="falling-rose">🌹</div>').css({
      left: sx + 'px',
      top: '-35px',
      fontSize: sz + 'px',
      animationDuration: dur + 's'
    });
    $('body').append(el);
    el.on('animationend', function() { el.remove(); });
    
    total++;
    numEl.text(total);
    bar.css('width', (total / maxRose * 100) + '%');
    
    if (total >= maxRose) onAllComplete();
  }

  var phase = 0, gt = null;
  function startGen(iv) {
    if (gt) clearInterval(gt);
    gt = setInterval(function() {
      if (total >= maxRose) { clearInterval(gt); return; }
      createFallingRose();
      if (phase === 0 && total > 250) { phase = 1; startGen(12); }
      else if (phase === 1 && total > 600) { phase = 2; startGen(8); }
    }, iv);
  }
  startGen(18);

  function onAllComplete() {
    setTimeout(function() {
      typeWriter($('#endText')[0], '💌 予你天长地久的偏爱，999朵玫瑰代表长长久久', 70);
    }, 800);
    
    setTimeout(function() {
      $('#completeOverlay').addClass('show');
      setTimeout(function() { $('#bigHeart').addClass('show'); }, 300);
      setTimeout(function() { $('#completeMsg').addClass('show'); }, 900);
      launchFireworks();
    }, 2500);
  }

  function launchFireworks() {
    var colors = ['#ff6b9d', '#ffd700', '#ff4757', '#ff8fab', '#e91e63', '#ffb6c1', '#ff69b4'];
    for (var f = 0; f < 6; f++) {
      (function(fi) {
        setTimeout(function() {
          var cx = Math.random() * window.innerWidth;
          var cy = Math.random() * window.innerHeight * 0.5 + 50;
          for (var i = 0; i < 20; i++) {
            var a = (i / 20) * Math.PI * 2;
            var d = 50 + Math.random() * 90;
            var s = 3 + Math.random() * 5;
            var c = colors[Math.floor(Math.random() * colors.length)];
            
            var p = $('<div class="firework-particle"></div>').css({
              left: cx + 'px',
              top: cy + 'px',
              width: s + 'px',
              height: s + 'px',
              background: c,
              boxShadow: '0 0 6px ' + c
            });
            p[0].style.setProperty('--fx', Math.cos(a) * d + 'px');
            p[0].style.setProperty('--fy', Math.sin(a) * d + 'px');
            $('body').append(p);
            p.on('animationend', function() { p.remove(); });
          }
        }, fi * 500);
      })(f);
    }
  }

  $(document).on('click', function(e) {
    var x = e.clientX, y = e.clientY;
    var em = ['💕', '💗', '💖', '❤️', '🌹', '✨', '💘'];
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      var d = 35 + Math.random() * 55;
      var h = $('<div class="click-heart">' + em[Math.floor(Math.random() * em.length)] + '</div>').css({
        left: x + 'px',
        top: y + 'px',
        fontSize: (10 + Math.random() * 14) + 'px'
      });
      h[0].style.setProperty('--dx', Math.cos(a) * d + 'px');
      h[0].style.setProperty('--dy', (Math.sin(a) * d - 25) + 'px');
      $('body').append(h);
      h.on('animationend', function() { h.remove(); });
    }
  });

  var lt = 0;
  $(document).on('mousemove', function(e) {
    var now = Date.now();
    if (now - lt < 100) return;
    lt = now;
    var tr = ['💕', '✨', '💗', '·'];
    var t = $('<div class="cursor-trail">' + tr[Math.floor(Math.random() * tr.length)] + '</div>').css({
      left: (e.clientX + (Math.random() - 0.5) * 16) + 'px',
      top: (e.clientY + (Math.random() - 0.5) * 16) + 'px',
      fontSize: (7 + Math.random() * 8) + 'px'
    });
    $('body').append(t);
    t.on('animationend', function() { t.remove(); });
  });

  function createPetal() {
    var pts = ['🌸', '💮', '🩷', '✿', '❀'];
    var p = $('<div class="ambient-petal">' + pts[Math.floor(Math.random() * pts.length)] + '</div>').css({
      left: (Math.random() * 100) + '%',
      top: '-20px',
      fontSize: (7 + Math.random() * 9) + 'px',
      animationDuration: (9 + Math.random() * 5) + 's'
    });
    $('body').append(p);
    p.on('animationend', function() { p.remove(); });
  }
  
  setInterval(createPetal, 2500);
  for (var i = 0; i < 4; i++) setTimeout(createPetal, i * 600);

  function typeWriter(el, text, sp) {
    var i = 0;
    el.style.opacity = 1;
    var t = setInterval(function() {
      if (i < text.length) {
        el.textContent += text[i];
        i++;
      } else {
        clearInterval(t);
      }
    }, sp);
  }
});
</script>
</body>
</html>
