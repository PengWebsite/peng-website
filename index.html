<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>七夕｜999朵玫瑰花</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Microsoft Yahei", sans-serif;
            background: linear-gradient(180deg, #fff 0%, #fff8fa 30%, #fff0f4 60%, #ffe8ef 100%);
            position: relative;
            cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><text y='18' font-size='16'>💕</text></svg>"), auto;
        }

        /* ===== 背景光斑 ===== */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 标题 ===== */
        .header {
            position: fixed;
            top: max(15px, 3vh);
            width: 100%;
            text-align: center;
            z-index: 100;
        }

        .title {
            color: #d63384;
            font-size: clamp(18px, 5vw, 30px);
            text-shadow: 0 2px 12px rgba(214,51,132,0.2);
            letter-spacing: 2px;
            opacity: 0;
        }

        .tip {
            color: #e075a0;
            font-size: clamp(12px, 3vw, 15px);
            margin-top: 6px;
            opacity: 0;
        }

        .tip span { font-weight: bold; color: #d63384; }

        .progress-wrap {
            width: min(180px, 45vw);
            height: 5px;
            background: rgba(255,182,193,0.3);
            border-radius: 3px;
            margin: 8px auto 0;
            overflow: hidden;
            opacity: 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8fab, #d63384);
            border-radius: 3px;
            transition: width 0.1s;
        }

        /* ===== 花束 ===== */
        .bouquet-wrap {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
        }

        .flower-ball {
            position: relative;
            width: min(240px, 60vw);
            height: min(240px, 60vw);
            border-radius: 50%;
        }

        .flower-ball .rose-item {
            position: absolute;
            user-select: none;
            opacity: 0;
            transform: scale(0);
        }

        .leaves {
            position: relative;
            width: min(200px, 50vw);
            height: 35px;
            margin-top: -12px;
            display: flex;
            justify-content: center;
            z-index: 2;
        }

        .leaf {
            width: clamp(18px, 4.5vw, 28px);
            height: clamp(28px, 6vw, 40px);
            background: linear-gradient(160deg, #66bb6a, #2e7d32);
            border-radius: 50% 0 50% 0;
            transform-origin: bottom center;
            opacity: 0;
            margin: 0 1px;
        }

        .paper-wrap {
            position: relative;
            width: min(140px, 38vw);
            height: min(120px, 26vw);
            background: linear-gradient(170deg, #fff5f7, #ffe4ec, #ffd6e0);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            margin-top: -3px;
            box-shadow: 0 8px 25px rgba(214,51,132,0.1);
            opacity: 0;
        }

        .bow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 22px;
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            top: 4px;
            width: 16px;
            height: 13px;
            background: linear-gradient(135deg, #ff6b9d, #e91e63);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }

        .bow::before { left: 0; transform: rotate(-12deg); }
        .bow::after { right: 0; transform: rotate(12deg); }

        .bow .knot {
            position: absolute;
            top: 7px; left: 50%;
            transform: translateX(-50%);
            width: 7px; height: 7px;
            background: #d63384;
            border-radius: 50%;
        }

        /* ===== 飘落玫瑰 ===== */
        .falling-rose {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            user-select: none;
        }

        /* ===== 点击爆炸爱心 ===== */
        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            user-select: none;
        }

        /* ===== 鼠标跟随 ===== */
        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 998;
            user-select: none;
            opacity: 0.8;
        }

        /* ===== 底部文字 ===== */
        .end-text {
            position: fixed;
            bottom: max(12px, 2.5vh);
            width: 100%;
            text-align: center;
            color: #d63384;
            font-size: clamp(13px, 3.5vw, 18px);
            z-index: 100;
            opacity: 0;
        }

        /* ===== 情侣+泰迪 ===== */
        .couple-section {
            position: fixed;
            bottom: max(35px, 5vh);
            right: max(8px, 2vw);
            z-index: 60;
            transform: scale(clamp(0.65, 1.8vw, 0.9));
            transform-origin: bottom right;
            opacity: 0;
        }

        .couple-container {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            position: relative;
        }

        .heart-between {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
        }

        .boy { position: relative; width: 36px; height: 72px; }
        .boy .b-head { width: 18px; height: 18px; background: #ffcc80; border-radius: 50%; margin: 0 auto; position: relative; }
        .boy .b-hair { position: absolute; top: -2px; left: 2px; width: 14px; height: 9px; background: #3e2723; border-radius: 50% 50% 0 0; }
        .boy .b-body { width: 22px; height: 28px; background: linear-gradient(#1565c0,#0d47a1); margin: 2px auto 0; border-radius: 5px 5px 2px 2px; }
        .boy .b-legs { display: flex; justify-content: center; gap: 2px; }
        .boy .b-leg { width: 7px; height: 18px; background: #37474f; border-radius: 0 0 3px 3px; }

        .girl { position: relative; width: 36px; height: 72px; }
        .girl .g-head { width: 16px; height: 16px; background: #ffcc80; border-radius: 50%; margin: 0 auto; position: relative; }
        .girl .g-hair { position: absolute; top: -3px; left: -2px; width: 20px; height: 12px; background: #4e342e; border-radius: 50% 50% 30% 30%; }
        .girl .g-hair::after, .girl .g-hair::before { content:''; position:absolute; top:7px; width:5px; height:12px; background:#4e342e; border-radius:0 0 3px 3px; }
        .girl .g-hair::after { left: -1px; }
        .girl .g-hair::before { right: -1px; }
        .girl .g-dress { width: 24px; height: 28px; background: linear-gradient(#e91e63,#c2185b); margin: 2px auto 0; clip-path: polygon(25% 0%,75% 0%,100% 100%,0% 100%); }
        .girl .g-legs { display: flex; justify-content: center; gap: 2px; }
        .girl .g-leg { width: 6px; height: 14px; background: #ffcc80; border-radius: 0 0 3px 3px; }

        .teddy { position: relative; width: 40px; height: 40px; margin-left: 5px; }
        .teddy .t-body { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:24px; height:20px; background:linear-gradient(135deg,#d4a574,#b8865a); border-radius:50% 50% 45% 45%; }
        .teddy .t-head { position:absolute; top:3px; left:50%; transform:translateX(-50%); width:20px; height:18px; background:linear-gradient(135deg,#d4a574,#c4956a); border-radius:50%; z-index:2; }
        .teddy .t-ear { position:absolute; top:0; width:8px; height:8px; background:#a0714a; border-radius:50%; z-index:1; }
        .teddy .t-ear.l { left: 8px; }
        .teddy .t-ear.r { right: 8px; }
        .teddy .t-eye { position:absolute; top:9px; width:3px; height:3px; background:#1a1a1a; border-radius:50%; z-index:3; }
        .teddy .t-eye.l { left: 13px; }
        .teddy .t-eye.r { right: 13px; }
        .teddy .t-nose { position:absolute; top:13px; left:50%; transform:translateX(-50%); width:4px; height:3px; background:#1a1a1a; border-radius:50%; z-index:3; }
        .teddy .t-tail { position:absolute; bottom:7px; right:3px; width:7px; height:7px; background:#d4a574; border-radius:50%; }

        /* ===== 完成弹窗 ===== */
        .complete-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            transition: background 2s;
        }

        .complete-overlay.show {
            background: rgba(255,255,255,0.88);
            pointer-events: auto;
        }

        .complete-overlay .big-heart {
            font-size: clamp(50px, 12vw, 70px);
            opacity: 0;
            transform: scale(0);
        }

        .complete-overlay .msg {
            margin-top: 15px;
            font-size: clamp(16px, 4.5vw, 26px);
            color: #d63384;
            text-align: center;
            line-height: 2;
            opacity: 0;
        }

        /* ===== 烟花粒子 ===== */
        .firework-particle {
            position: fixed;
            pointer-events: none;
            z-index: 300;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <!-- 背景光斑 -->
    <div class="bg-orb" style="width:45vmin;height:45vmin;background:rgba(255,182,193,0.4);top:-8%;left:-8%;"></div>
    <div class="bg-orb" style="width:38vmin;height:38vmin;background:rgba(255,228,235,0.5);top:12%;right:-6%;"></div>
    <div class="bg-orb" style="width:32vmin;height:32vmin;background:rgba(230,210,255,0.3);bottom:8%;left:8%;"></div>
    <div class="bg-orb" style="width:28vmin;height:28vmin;background:rgba(255,240,245,0.5);top:38%;left:38%;"></div>

    <!-- 标题 -->
    <div class="header">
        <div class="title">🌹 999朵玫瑰 · 七夕快乐 🌹</div>
        <div class="tip">已送出：<span id="num">0</span> / 999 朵</div>
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- 花束 -->
    <div class="bouquet-wrap" id="bouquetWrap">
        <div class="flower-ball" id="flowerBall"></div>
        <div class="leaves" id="leavesRow">
            <div class="leaf" style="transform:rotate(-30deg)"></div>
            <div class="leaf" style="transform:rotate(-15deg)"></div>
            <div class="leaf" style="transform:rotate(0deg)"></div>
            <div class="leaf" style="transform:rotate(15deg) scaleX(-1)"></div>
            <div class="leaf" style="transform:rotate(30deg) scaleX(-1)"></div>
            <div class="leaf" style="transform:rotate(-20deg)"></div>
            <div class="leaf" style="transform:rotate(20deg) scaleX(-1)"></div>
        </div>
        <div class="paper-wrap" id="paperWrap">
            <div class="bow"><div class="knot"></div></div>
        </div>
    </div>

    <!-- 底部文字 -->
    <div class="end-text" id="endText"></div>

    <!-- 情侣+泰迪 -->
    <div class="couple-section" id="coupleSection">
        <div class="couple-container">
            <div class="heart-between" id="heartBetween">💗</div>
            <div class="boy" id="boy">
                <div class="b-head"><div class="b-hair"></div></div>
                <div class="b-body"></div>
                <div class="b-legs"><div class="b-leg"></div><div class="b-leg"></div></div>
            </div>
            <div class="girl" id="girl">
                <div class="g-head"><div class="g-hair"></div></div>
                <div class="g-dress"></div>
                <div class="g-legs"><div class="g-leg"></div><div class="g-leg"></div></div>
            </div>
            <div class="teddy" id="teddy">
                <div class="t-ear l"></div>
                <div class="t-ear r"></div>
                <div class="t-head">
                    <div class="t-eye l"></div>
                    <div class="t-eye r"></div>
                    <div class="t-nose"></div>
                </div>
                <div class="t-body"></div>
                <div class="t-tail" id="teddyTail"></div>
            </div>
        </div>
    </div>

    <!-- 完成弹窗 -->
    <div class="complete-overlay" id="completeOverlay">
        <div class="big-heart" id="bigHeart">💝</div>
        <div class="msg" id="completeMsg">999朵玫瑰已送达<br>愿你被这世界温柔以待<br>七夕快乐 ❤️</div>
    </div>

    <script>
    $(function() {
        const maxRose = 999;
        let total = 0;
        let bouquetBuilt = false;

        // ===== 初始化背景光斑动画 =====
        $('.bg-orb').each(function(i) {
            $(this).css({
                animation: `orbMove${i % 2 === 0 ? 'A' : 'B'} ${8 + i * 2}s ease-in-out infinite alternate`
            });
        });

        // 注入光斑动画keyframes
        $('<style>')
            .text(`
                @keyframes orbMoveA { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(25px,-18px) scale(1.1)} }
                @keyframes orbMoveB { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-20px,15px) scale(1.05)} }
            `)
            .appendTo('head');

        // ===== 入场动画 =====
        $('.title').delay(300).animate({ opacity: 1 }, 800);
        $('.tip').delay(600).animate({ opacity: 1 }, 600);
        $('.progress-wrap').delay(800).animate({ opacity: 1 }, 600);
        $('#bouquetWrap').delay(500).animate({ opacity: 1 }, 1000);
        $('#coupleSection').delay(1200).animate({ opacity: 1 }, 800);

        // ===== 构建花束（圆形花朵）=====
        function buildFlowerBall() {
            const $ball = $('#flowerBall');
            const size = $ball.width();
            const count = 75;
            const roses = [];

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * (size / 2 - 12);
                const x = size / 2 + Math.cos(angle) * r - 10;
                const y = size / 2 + Math.sin(angle) * r - 10;
                roses.push({ x, y });
            }

            // 按距离中心排序，由内向外绽放
            roses.sort((a, b) => {
                const da = Math.hypot(a.x - size/2, a.y - size/2);
                const db = Math.hypot(b.x - size/2, b.y - size/2);
                return da - db;
            });

            roses.forEach((pos, i) => {
                const $rose = $('<span class="rose-item">🌹</span>').css({
                    left: pos.x + 'px',
                    top: pos.y + 'px',
                    fontSize: (14 + Math.random() * 8) + 'px'
                });
                $ball.append($rose);

                setTimeout(() => {
                    $rose.animate({ opacity: 1 }, 300);
                    $rose.css('transform', 'scale(1)');
                    $rose.css({
                        transition: 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)'
                    });
                }, 800 + i * 30);
            });

            // 绿叶出现
            setTimeout(() => {
                $('.leaf').each(function(i) {
                    $(this).delay(i * 100).animate({ opacity: 1 }, 400);
                });
            }, 800 + count * 30 + 200);

            // 包装纸出现
            setTimeout(() => {
                $('#paperWrap').animate({ opacity: 1 }, 600);
            }, 800 + count * 30 + 800);
        }

        buildFlowerBall();

        // ===== 999朵玫瑰飘落 =====
        function createFallingRose() {
            if (total >= maxRose) return;

            const size = 14 + Math.random() * 16;
            const startX = Math.random() * $(window).width();
            const dur = 3000 + Math.random() * 4000;
            const sway = (Math.random() - 0.5) * 100;

            const $rose = $('<div class="falling-rose">🌹</div>').css({
                left: startX + 'px',
                top: -40 + 'px',
                fontSize: size + 'px'
            });

            $('body').append($rose);

            // jQuery动画：飘落 + 摇摆 + 消失
            $rose.animate({
                top: $(window).height() + 50,
                left: startX + sway,
                opacity: 0
            }, {
                duration: dur,
                easing: 'linear',
                step: function(now, fx) {
                    if (fx.prop === 'top') {
                        const progress = now / $(window).height();
                        const rotate = progress * 360;
                        const scale = 1 - progress * 0.4;
                        $(this).css('transform', `rotate(${rotate}deg) scale(${scale})`);
                    }
                },
                complete: function() {
                    $(this).remove();
                }
            });

            total++;
            $('#num').text(total);
            $('#progressBar').css('width', (total / maxRose * 100) + '%');

            if (total >= maxRose) {
                onAllComplete();
            }
        }

        // 定时生成
        let genInterval = 70;
        const genTimer = setInterval(() => {
            createFallingRose();
            if (total > 400) genInterval = 45;
            if (total > 700) genInterval = 30;
            if (total >= maxRose) clearInterval(genTimer);
        }, genInterval);

        // ===== 完成回调 =====
        function onAllComplete() {
            setTimeout(() => {
                $('#endText').text('💌 予你天长地久的偏爱，999朵玫瑰代表长长久久').animate({ opacity: 1 }, 1500);
            }, 1000);

            setTimeout(() => {
                $('#completeOverlay').addClass('show');
                $('#bigHeart').css({ opacity: 1, transform: 'scale(1)', transition: 'all 0.8s cubic-bezier(0.34,1.56,0.64,1)' });
                setTimeout(() => {
                    $('#completeMsg').animate({ opacity: 1 }, 1000);
                }, 600);
                // 烟花
                launchFireworks();
            }, 3000);
        }

        // ===== 烟花效果 =====
        function launchFireworks() {
            for (let f = 0; f < 5; f++) {
                setTimeout(() => {
                    const cx = Math.random() * $(window).width();
                    const cy = Math.random() * $(window).height() * 0.5;
                    const colors = ['#ff6b9d', '#ffd700', '#ff4757', '#ff8fab', '#e91e63', '#ffb6c1'];

                    for (let i = 0; i < 20; i++) {
                        const angle = (i / 20) * Math.PI * 2;
                        const dist = 60 + Math.random() * 80;
                        const size = 4 + Math.random() * 4;
                        const color = colors[Math.floor(Math.random() * colors.length)];

                        const $p = $('<div class="firework-particle"></div>').css({
                            left: cx + 'px',
                            top: cy + 'px',
                            width: size + 'px',
                            height: size + 'px',
                            background: color,
                            boxShadow: `0 0 6px ${color}`
                        });

                        $('body').append($p);

                        $p.animate({
                            left: cx + Math.cos(angle) * dist,
                            top: cy + Math.sin(angle) * dist,
                            opacity: 0
                        }, 1000 + Math.random() * 500, function() {
                            $(this).remove();
                        });
                    }
                }, f * 600);
            }
        }

        // ===== 点击屏幕爆炸爱心 =====
        $(document).on('click touchstart', function(e) {
            const x = e.pageX || e.originalEvent.touches[0].pageX;
            const y = e.pageY || e.originalEvent.touches[0].pageY;
            const emojis = ['💕', '💗', '💖', '❤️', '🌹', '✨', '💘'];

            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const dist = 40 + Math.random() * 50;
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                const size = 12 + Math.random() * 12;

                const $h = $(`<div class="click-heart">${emoji}</div>`).css({
                    left: x + 'px',
                    top: y + 'px',
                    fontSize: size + 'px'
                });

                $('body').append($h);

                $h.animate({
                    left: x + Math.cos(angle) * dist,
                    top: y + Math.sin(angle) * dist - 30,
                    opacity: 0
                }, 800 + Math.random() * 400, function() {
                    $(this).remove();
                });
            }
        });

        // ===== 鼠标/触摸跟随轨迹 =====
        let lastTrail = 0;
        $(document).on('mousemove touchmove', function(e) {
            const now = Date.now();
            if (now - lastTrail < 80) return;
            lastTrail = now;

            const x = e.pageX || (e.originalEvent.touches && e.originalEvent.touches[0].pageX);
            const y = e.pageY || (e.originalEvent.touches && e.originalEvent.touches[0].pageY);
            if (!x || !y) return;

            const trailEmojis = ['💕', '✨', '💗', '·'];
            const emoji = trailEmojis[Math.floor(Math.random() * trailEmojis.length)];

            const $trail = $(`<div class="cursor-trail">${emoji}</div>`).css({
                left: x + (Math.random() - 0.5) * 20 + 'px',
                top: y + (Math.random() - 0.5) * 20 + 'px',
                fontSize: (8 + Math.random() * 8) + 'px'
            });

            $('body').append($trail);

            $trail.animate({
                top: y - 30 - Math.random() * 20,
                opacity: 0
            }, 1000, function() {
                $(this).remove();
            });
