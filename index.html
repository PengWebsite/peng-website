<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>七夕｜999朵玫瑰花</title>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;font-family:"Microsoft Yahei",sans-serif;background:linear-gradient(180deg,#fff 0%,#fff8fa 30%,#fff0f4 60%,#ffe8ef 100%);position:relative}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;pointer-events:none;z-index:0;animation:orbAnim 10s ease-in-out infinite alternate}
@keyframes orbAnim{0%{transform:translate(0,0) scale(1)}100%{transform:translate(20px,-15px) scale(1.08)}}
.header{position:fixed;top:max(12px,2.5vh);width:100%;text-align:center;z-index:100}
.title{color:#d63384;font-size:clamp(18px,5vw,30px);text-shadow:0 2px 12px rgba(214,51,132,.2);letter-spacing:2px;opacity:0}
.tip{color:#e075a0;font-size:clamp(12px,3vw,15px);margin-top:5px;opacity:0}
.tip span{font-weight:bold;color:#d63384}
.progress-wrap{width:min(180px,45vw);height:5px;background:rgba(255,182,193,.3);border-radius:3px;margin:8px auto 0;overflow:hidden;opacity:0}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff8fab,#d63384);border-radius:3px;transition:width .15s linear}
.bouquet-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:flex;flex-direction:column;align-items:center;opacity:0;animation:breathe 4.4s ease-in-out infinite}
@keyframes breathe{0%,100%{margin-top:-4px}50%{margin-top:4px}}
.flower-ball{position:relative;width:min(250px,62vw);height:min(250px,62vw);border-radius:50%}
.flower-ball .rose-item{position:absolute;user-select:none;opacity:0;transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s;line-height:1;will-change:transform,opacity}
.flower-ball .rose-item.show{opacity:1;transform:scale(1)}
.leaves{position:relative;width:min(210px,52vw);height:38px;margin-top:-14px;display:flex;justify-content:center;z-index:2}
.leaf{width:clamp(16px,4vw,26px);height:clamp(26px,5.5vw,38px);background:linear-gradient(160deg,#66bb6a,#2e7d32);border-radius:50% 0 50% 0;transform-origin:bottom center;opacity:0;margin:0 1px;transition:opacity .35s}
.leaf.show{opacity:1}
.paper-wrap{position:relative;width:min(130px,35vw);height:min(110px,24vw);background:linear-gradient(170deg,#fff5f7,#ffe4ec,#ffd6e0);clip-path:polygon(15% 0%,85% 0%,100% 100%,0% 100%);margin-top:-3px;box-shadow:0 8px 25px rgba(214,51,132,.1);opacity:0;transition:opacity .5s}
.paper-wrap.show{opacity:1}
.bow{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:34px;height:20px}
.bow::before,.bow::after{content:'';position:absolute;top:4px;width:15px;height:12px;background:linear-gradient(135deg,#ff6b9d,#e91e63);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.bow::before{left:0;transform:rotate(-12deg)}
.bow::after{right:0;transform:rotate(12deg)}
.bow .knot{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:7px;height:7px;background:#d63384;border-radius:50%}
.falling-rose{position:fixed;z-index:50;pointer-events:none;user-select:none;will-change:transform;animation:fallDown linear forwards}
@keyframes fallDown{0%{transform:translateY(0) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(110vh) rotate(320deg);opacity:0}}
.click-heart{position:fixed;pointer-events:none;z-index:999;user-select:none;animation:heartBurst .8s ease-out forwards}
@keyframes heartBurst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.cursor-trail{position:fixed;pointer-events:none;z-index:998;user-select:none;animation:trailUp .9s ease-out forwards}
@keyframes trailUp{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-30px);opacity:0}}
.end-text{position:fixed;bottom:max(10px,2vh);width:100%;text-align:center;color:#d63384;font-size:clamp(12px,3.2vw,17px);z-index:100;opacity:0}
.couple-section{position:fixed;bottom:max(30px,4.5vh);right:max(8px,2vw);z-index:60;transform:scale(clamp(.6,1.8vw,.85));transform-origin:bottom right;opacity:0}
.couple-container{display:flex;align-items:flex-end;gap:5px;position:relative}
.heart-between{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:14px;animation:heartPulse .7s ease-in-out infinite alternate}
@keyframes heartPulse{0%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(1.3)}}
.boy{position:relative;width:36px;height:72px;animation:sway 1.8s ease-in-out infinite alternate}
.girl{position:relative;width:36px;height:72px;animation:sway 1.8s ease-in-out infinite alternate-reverse}
@keyframes sway{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
.boy .b-head{width:18px;height:18px;background:#ffcc80;border-radius:50%;margin:0 auto;position:relative}
.boy .b-hair{position:absolute;top:-2px;left:2px;width:14px;height:9px;background:#3e2723;border-radius:50% 50% 0 0}
.boy .b-body{width:22px;height:28px;background:linear-gradient(#1565c0,#0d47a1);margin:2px auto 0;border-radius:5px 5px 2px 2px}
.boy .b-legs{display:flex;justify-content:center;gap:2px}
.boy .b-leg{width:7px;height:18px;background:#37474f;border-radius:0 0 3px 3px}
.girl .g-head{width:16px;height:16px;background:#ffcc80;border-radius:50%;margin:0 auto;position:relative}
.girl .g-hair{position:absolute;top:-3px;left:-2px;width:20px;height:12px;background:#4e342e;border-radius:50% 50% 30% 30%}
.girl .g-hair::after,.girl .g-hair::before{content:'';position:absolute;top:7px;width:5px;height:12px;background:#4e342e;border-radius:0 0 3px 3px}
.girl .g-hair::after{left:-1px}
.girl .g-hair::before{right:-1px}
.girl .g-dress{width:24px;height:28px;background:linear-gradient(#e91e63,#c2185b);margin:2px auto 0;clip-path:polygon(25% 0%,75% 0%,100% 100%,0% 100%)}
.girl .g-legs{display:flex;justify-content:center;gap:2px}
.girl .g-leg{width:6px;height:14px;background:#ffcc80;border-radius:0 0 3px 3px}
.teddy{position:relative;width:40px;height:40px;margin-left:5px;animation:teddyBounce .56s ease-in-out infinite alternate}
@keyframes teddyBounce{0%{transform:translateY(0)}100%{transform:translateY(-5px)}}
.teddy .t-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:20px;background:linear-gradient(135deg,#d4a574,#b8865a);border-radius:50% 50% 45% 45%}
.teddy .t-head{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:20px;height:18px;background:linear-gradient(135deg,#d4a574,#c4956a);border-radius:50%;z-index:2}
.teddy .t-ear{position:absolute;top:0;width:8px;height:8px;background:#a0714a;border-radius:50%;z-index:1}
.teddy .t-ear.l{left:8px}
.teddy .t-ear.r{right:8px}
.teddy .t-eye{position:absolute;top:9px;width:3px;height:3px;background:#1a1a1a;border-radius:50%;z-index:3;animation:blink 2.8s infinite}
.teddy .t-eye.l{left:13px}
.teddy .t-eye.r{right:13px}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.teddy .t-nose{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:4px;height:3px;background:#1a1a1a;border-radius:50%;z-index:3}
.teddy .t-tail{position:absolute;bottom:7px;right:3px;width:7px;height:7px;background:#d4a574;border-radius:50%;animation:tailWag .38s ease-in-out infinite alternate}
@keyframes tailWag{0%{transform:rotate(-20deg)}100%{transform:rotate(20deg)}}
.complete-overlay{position:fixed;inset:0;background:rgba(255,255,255,0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;pointer-events:none;transition:background 2s}
.complete-overlay.show{background:rgba(255,255,255,.9);pointer-events:auto}
.complete-overlay .big-heart{font-size:clamp(50px,12vw,70px);opacity:0;transform:scale(0);transition:all .8s cubic-bezier(.34,1.56,.64,1)}
.complete-overlay .big-heart.show{opacity:1;transform:scale(1)}
.complete-overlay .msg{margin-top:15px;font-size:clamp(16px,4.5vw,26px);color:#d63384;text-align:center;line-height:2;opacity:0;transition:opacity 1s}
.complete-overlay .msg.show{opacity:1}
.firework-particle{position:fixed;pointer-events:none;z-index:300;border-radius:50%;animation:fireworkBurst 1s ease-out forwards}
@keyframes fireworkBurst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(.3);opacity:0}}
.ambient-petal{position:fixed;pointer-events:none;z-index:1;animation:petalFall linear forwards}
@keyframes petalFall{0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translateY(110vh) translateX(30px) rotate(180deg);opacity:0}}
</style>
</head>
<body>
<div class="bg-orb" style="width:45vmin;height:45vmin;background:rgba(255,182,193,.4);top:-8%;left:-8%"></div>
<div class="bg-orb" style="width:38vmin;height:38vmin;background:rgba(255,228,235,.5);top:12%;right:-6%;animation-delay:-3s"></div>
<div class="bg-orb" style="width:32vmin;height:32vmin;background:rgba(230,210,255,.3);bottom:8%;left:8%;animation-delay:-5s"></div>
<div class="bg-orb" style="width:28vmin;height:28vmin;background:rgba(255,240,245,.5);top:38%;left:38%;animation-delay:-2s"></div>

<div class="header">
    <div class="title">🌹 999朵玫瑰 · 七夕快乐 🌹</div>
    <div class="tip">已送出：<span id="num">0</span> / 999 朵</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="bouquet-wrap" id="bouquetWrap">
    <div class="flower-ball" id="flowerBall"></div>
    <div class="leaves" id="leavesRow">
        <div class="leaf" style="transform:rotate(-30deg)"></div>
        <div class="leaf" style="transform:rotate(-18deg)"></div>
        <div class="leaf" style="transform:rotate(-6deg)"></div>
        <div class="leaf" style="transform:rotate(0deg)"></div>
        <div class="leaf" style="transform:rotate(6deg) scaleX(-1)"></div>
        <div class="leaf" style="transform:rotate(18deg) scaleX(-1)"></div>
        <div class="leaf" style="transform:rotate(30deg) scaleX(-1)"></div>
    </div>
    <div class="paper-wrap" id="paperWrap">
        <div class="bow"><div class="knot"></div></div>
    </div>
</div>

<div class="end-text" id="endText"></div>

<div class="couple-section" id="coupleSection">
    <div class="couple-container">
        <div class="heart-between">💗</div>
        <div class="boy">
            <div class="b-head"><div class="b-hair"></div></div>
            <div class="b-body"></div>
            <div class="b-legs"><div class="b-leg"></div><div class="b-leg"></div></div>
        </div>
        <div class="girl">
            <div class="g-head"><div class="g-hair"></div></div>
            <div class="g-dress"></div>
            <div class="g-legs"><div class="g-leg"></div><div class="g-leg"></div></div>
        </div>
        <div class="teddy">
            <div class="t-ear l"></div>
            <div class="t-ear r"></div>
            <div class="t-head">
                <div class="t-eye l"></div>
                <div class="t-eye r"></div>
                <div class="t-nose"></div>
            </div>
            <div class="t-body"></div>
            <div class="t-tail"></div>
        </div>
    </div>
</div>

<div class="complete-overlay" id="completeOverlay">
    <div class="big-heart" id="bigHeart">💝</div>
    <div class="msg" id="completeMsg">999朵玫瑰已送达<br>愿你被这世界温柔以待<br>七夕快乐 ❤️</div>
</div>

<script>
$(function(){
    var maxRose=999,total=0;
    var numEl=document.getElementById('num');
    var progressBar=document.getElementById('progressBar');

    // 入场
    $('.title').delay(200).animate({opacity:1},600);
    $('.tip').delay(500).animate({opacity:1},500);
    $('.progress-wrap').delay(700).animate({opacity:1},500);
    $('#bouquetWrap').delay(400).animate({opacity:1},800);
    $('#coupleSection').delay(1000).animate({opacity:1},700);

    // 花束填充
    function buildFlowerBall(){
        var ball=document.getElementById('flowerBall');
        var size=ball.offsetWidth||250;
        var radius=size/2;
        var goldenAngle=Math.PI*(3-Math.sqrt(5));
        var positions=[];
        var i,j,k,r,theta,x,y,angle,a2;

        for(i=0;i<120;i++){
            r=(radius-6)*Math.sqrt(i/120);
            theta=i*goldenAngle;
            positions.push({x:radius+r*Math.cos(theta),y:radius+r*Math.sin(theta),dist:r});
        }
        for(j=0;j<24;j++){
            angle=(j/24)*Math.PI*2;
            positions.push({x:radius+(radius-9)*Math.cos(angle),y:radius+(radius-9)*Math.sin(angle),dist:radius-9});
        }
        for(k=0;k<16;k++){
            a2=(k/16)*Math.PI*2+0.3;
            positions.push({x:radius+(radius-6)*0.55*Math.cos(a2),y:radius+(radius-6)*0.55*Math.sin(a2),dist:(radius-6)*0.55});
        }
        positions.sort(function(a,b){return a.dist-b.dist});

        var flowerSize=Math.max(16,Math.floor(size/10));
        var frag=document.createDocumentFragment();
        var els=[];

        positions.forEach(function(pos){
            var span=document.createElement('span');
            span.className='rose-item';
            span.textContent='🌹';
            span.style.left=(pos.x-flowerSize/2)+'px';
            span.style.top=(pos.y-flowerSize/2)+'px';
            span.style.fontSize=flowerSize+'px';
            frag.appendChild(span);
            els.push(span);
        });
        ball.appendChild(frag);

        els.forEach(function(el,idx){
            setTimeout(function(){el.classList.add('show')},600+idx*60);
        });

        var done=600+els.length*60+300;
        setTimeout(function(){
            var leaves=document.querySelectorAll('.leaf');
            for(var i=0;i<leaves.length;i++){
                (function(el,delay){setTimeout(function(){el.classList.add('show')},delay)})(leaves[i],i*80);
            }
        },done);
        setTimeout(function(){
            document.getElementById('paperWrap').classList.add('show');
        },done+500);
    }
    buildFlowerBall();

    // 飘落玫瑰
    function createFallingRose(){
        if(total>=maxRose)return;
        var size=14+Math.random()*14;
        var startX=Math.random()*(window.innerWidth-30);
        var duration=2+Math.random()*1.5;
        var el=document.createElement('div');
        el.className='falling-rose';
        el.textContent='🌹';
        el.style.left=startX+'px';
        el.style.top='-35px';
        el.style.fontSize=size+'px';
        el.style.animationDuration=duration+'s';
        document.body.appendChild(el);
        el.addEventListener('animationend',function(){if(el.parentNode)el.parentNode.removeChild(el)});

        total++;
        numEl.textContent=total;
        progressBar.style.width=(total/maxRose*100)+'%';
        if(total>=maxRose)onAllComplete();
    }

    var phase=0,genTimer=null;
    function startGen(interval){
        if(genTimer)clearInterval(genTimer);
        genTimer=setInterval(function(){
            if(total>=maxRose){clearInterval(genTimer);return}
            createFallingRose();
            if(phase===0&&total>250){phase=1;startGen(12)}
            else if(phase===1&&total>600){phase=2;startGen(8)}
        },interval);
    }
    startGen(18);

    // 完成
    function onAllComplete(){
        setTimeout(function(){
            typeWriter(document.getElementById('endText'),'💌 予你天长地久的偏爱，999朵玫瑰代表长长久久',70);
        },800);
        setTimeout(function(){
            document.getElementById('completeOverlay').classList.add('show');
            setTimeout(function(){document.getElementById('bigHeart').classList.add('show')},300);
            setTimeout(function(){document.getElementById('completeMsg').classList.add('show')},900);
            launchFireworks();
        },2500);
    }

    // 烟花
    function launchFireworks(){
        var colors=['#ff6b9d','#ffd700','#ff4757','#ff8fab','#e91e63','#ffb6c1','#ff69b4'];
        for(var f=0;f<6;f++){
            (function(fi){
                setTimeout(function(){
                    var cx=Math.random()*window.innerWidth;
                    var cy=Math.random()*window.innerHeight*0.5+50;
                    for(var i=0;i<20;i++){
                        var angle=(i/20)*Math.PI*2;
                        var dist=50+Math.random()*90;
                        var sz=3+Math.random()*5;
                        var color=colors[Math.floor(Math.random()*colors.length)];
                        var dx=Math.cos(angle)*dist;
                        var dy=Math.sin(angle)*dist;
                        var p=document.createElement('div');
                        p.className='firework-particle';
                        p.style.left=cx+'px';
                        p.style.top=cy+'px';
                        p.style.width=sz+'px';
                        p.style.height=sz+'px';
                        p.style.background=color;
                        p.style.boxShadow='0 0 6px '+color;
                        p.style.setProperty('--fx',dx+'px');
                        p.style.setProperty('--fy',dy+'px');
                        document.body.appendChild(p);
                        p.addEventListener('animationend',function(){if(p.parentNode)p.parentNode.removeChild(p)});
                    }
                },fi*500);
            })(f);
        }
    }

    // 点击爱心
    document.addEventListener('click',function(e){
        var x=e.clientX,y=e.clientY;
        var emojis=['💕','💗','💖','❤️','🌹','✨','💘'];
        for(var i=0;i<8;i++){
            var angle=(i/8)*Math.PI*2;
            var dist=35+Math.random()*55;
            var dx=Math.cos(angle)*dist;
            var dy=Math.sin(angle)*dist-25;
            var emoji=emojis[Math.floor(Math.random()*emojis.length)];
            var h=document.createElement('div');
            h.className='click-heart';
            h.textContent=emoji;
            h.style.left=x+'px';
            h.style.top=y+'px';
            h.style.fontSize=(10+Math.random()*14)+'px';
            h.style.setProperty('--dx',dx+'px');
            h.style.setProperty('--dy',dy+'px');
            document.body.appendChild(h);
            h.addEventListener('animationend',function(){if(h.parentNode)h.parentNode.removeChild(h)});
        }
    });

    // 鼠标轨迹
    var lastTrail=0;
    document.addEventListener('mousemove',function(e){
        var now=Date.now();
        if(now-lastTrail<100)return;
        lastTrail=now;
        var trails=['💕','✨','💗','·'];
        var emoji=trails[Math.floor(Math.random()*trails.length)];
        var t=document.createElement('div');
        t.className='cursor-trail';
        t.textContent=emoji;
        t.style.left=(e.clientX+(Math.random()-.5)*16)+'px';
        t.style.top=(e.clientY+(Math.random()-.5)*16)+'px';
        t.style.fontSize=(7+Math.random()*8)+'px';
        document.body.appendChild(t);
        t.addEventListener('animationend',function(){if(t.parentNode)t.parentNode.removeChild(t)});
    });

    // 背景花瓣
    function createAmbientPetal(){
        var petals=['🌸','💮','🩷','✿','❀'];
        var petal=petals[Math.floor(Math.random()*petals.length)];
        var dur=9+Math.random()*5;
        var p=document.createElement('div');
        p.className='ambient-petal';
        p.textContent=petal;
        p.style.left=(Math.random()*100)+'%';
        p.style.top='-20px';
        p.style.fontSize=(7+Math.random()*9)+'px';
        p.style.animationDuration=dur+'s';
        document.body.appendChild(p);
        p.addEventListener('animationend',function(){if(p.parentNode)p.parentNode.removeChild(p)});
    }
    setInterval(createAmbientPetal,2500);
    for(var i=0;i<4;i++){setTimeout(createAmbientPetal,i*600)}

    // 打字机
    function typeWriter(el,text,speed){
        var i=0;
        el.style.opacity=1;
        var t=setInterval(function(){
            if(i<text.length){el.textContent+=text[i];i++}
            else{clearInterval(t)}
        },speed);
    }
});
</script>
</body>
</html>
