<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>七夕｜999朵玫瑰花</title>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;font-family:"Microsoft Yahei",sans-serif;background:linear-gradient(180deg,#fff,#fff8fa 30%,#fff0f4 60%,#ffe8ef);position:relative}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;pointer-events:none;z-index:0;animation:orb 10s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(20px,-15px) scale(1.08)}}
.header{position:fixed;top:max(12px,2.5vh);width:100%;text-align:center;z-index:100}
.title{color:#d63384;font-size:clamp(18px,5vw,30px);text-shadow:0 2px 12px rgba(214,51,132,.2);letter-spacing:2px;opacity:0}
.tip{color:#e075a0;font-size:clamp(12px,3vw,15px);margin-top:5px;opacity:0}
.tip span{font-weight:bold;color:#d63384}
.progress-wrap{width:min(180px,45vw);height:5px;background:rgba(255,182,193,.3);border-radius:3px;margin:8px auto 0;overflow:hidden;opacity:0}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#ff8fab,#d63384);border-radius:3px;transition:width .15s}
.bouquet-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:flex;flex-direction:column;align-items:center;opacity:0;animation:br 4.4s ease-in-out infinite}
@keyframes br{0%,100%{margin-top:-4px}50%{margin-top:4px}}
.flower-ball{position:relative;width:min(250px,62vw);height:min(250px,62vw);border-radius:50%}
.rose-item{position:absolute;user-select:none;opacity:0;transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s;line-height:1}
.rose-item.show{opacity:1;transform:scale(1)}
.leaves{position:relative;width:min(230px,56vw);height:44px;margin-top:-16px;display:flex;justify-content:center;z-index:2}
.leaf{width:clamp(18px,4.5vw,28px);height:clamp(30px,6vw,42px);background:linear-gradient(160deg,#81c784,#4caf50 40%,#2e7d32);border-radius:50% 50% 50% 0;transform-origin:bottom center;opacity:0;margin:0 1.5px;transition:opacity .35s;position:relative;box-shadow:inset -2px -3px 6px rgba(0,0,0,.12),inset 1px 2px 4px rgba(255,255,255,.25)}
.leaf::after{content:'';position:absolute;top:20%;left:48%;width:1.5px;height:55%;background:rgba(255,255,255,.35);border-radius:1px}
.leaf.show{opacity:1}
.leaf.small{width:clamp(12px,3vw,18px);height:clamp(20px,4vw,28px);border-radius:50% 50% 0 50%}
.paper-wrap{position:relative;width:min(140px,38vw);height:min(120px,26vw);background:linear-gradient(170deg,#fff9fb,#ffeef3 25%,#ffe0ea 50%,#ffd4e2 75%,#ffc8d9);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);margin-top:-4px;box-shadow:0 10px 30px rgba(214,51,132,.12);opacity:0;transition:opacity .5s;overflow:hidden}
.paper-wrap.show{opacity:1}
.paper-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.4) 22%,transparent 24%),linear-gradient(105deg,transparent 45%,rgba(255,255,255,.3) 47%,transparent 49%),linear-gradient(105deg,transparent 70%,rgba(255,255,255,.35) 72%,transparent 74%)}
.paper-wrap::after{content:'';position:absolute;top:0;left:18%;right:18%;height:8px;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
.bow{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:44px;height:26px}
.bow::before,.bow::after{content:'';position:absolute;top:3px;width:19px;height:15px;background:linear-gradient(135deg,#ff8fab,#e91e63);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:inset -2px -2px 4px rgba(0,0,0,.1)}
.bow::before{left:0;transform:rotate(-15deg)}
.bow::after{right:0;transform:rotate(15deg)}
.bow .knot{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:9px;height:9px;background:radial-gradient(circle at 35% 35%,#ff6b9d,#c2185b);border-radius:50%}
.bow .ribbon-l,.bow .ribbon-r{position:absolute;top:14px;width:5px;height:18px;background:linear-gradient(180deg,#e91e63,#ad1457);border-radius:0 0 3px 3px}
.bow .ribbon-l{left:14px;transform:rotate(8deg)}
.bow .ribbon-r{right:14px;transform:rotate(-8deg)}
.falling-rose{position:fixed;z-index:50;pointer-events:none;user-select:none;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}85%{opacity:1}100%{transform:translateY(110vh) rotate(320deg);opacity:0}}
.click-heart{position:fixed;pointer-events:none;z-index:999;animation:hb .8s ease-out forwards}
@keyframes hb{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.cursor-trail{position:fixed;pointer-events:none;z-index:998;animation:tu .9s ease-out forwards}
@keyframes tu{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-30px);opacity:0}}
.end-text{position:fixed;bottom:max(10px,2vh);width:100%;text-align:center;color:#d63384;font-size:clamp(12px,3.2vw,17px);z-index:100;opacity:0}
.couple-section{position:fixed;bottom:max(30px,4.5vh);right:max(8px,2vw);z-index:60;transform:scale(clamp(.6,1.8vw,.85));transform-origin:bottom right;opacity:0}
.couple-container{display:flex;align-items:flex-end;gap:6px;position:relative}
.heart-between{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:14px;animation:hp .7s ease-in-out infinite alternate}
@keyframes hp{to{transform:translateX(-50%) scale(1.35)}}
.boy{position:relative;width:38px;height:74px;animation:bs 2.2s ease-in-out infinite}
@keyframes bs{0%,100%{transform:translateX(-1.5px) rotate(-.5deg)}50%{transform:translateX(1.5px) rotate(.5deg)}}
.b-head{width:19px;height:19px;background:linear-gradient(135deg,#ffe0b2,#ffcc80);border-radius:50%;margin:0 auto;position:relative}
.b-hair{position:absolute;top:-3px;left:1px;width:17px;height:10px;background:#3e2723;border-radius:50% 50% 0 0}
.b-eye-l,.b-eye-r{position:absolute;top:9px;width:2.5px;height:2.5px;background:#333;border-radius:50%}
.b-eye-l{left:5px}.b-eye-r{right:5px}
.b-blush-l,.b-blush-r{position:absolute;top:12px;width:4px;height:2.5px;background:rgba(255,138,128,.3);border-radius:50%}
.b-blush-l{left:2px}.b-blush-r{right:2px}
.b-body{width:23px;height:30px;background:linear-gradient(180deg,#1976d2,#1565c0);margin:2px auto 0;border-radius:5px 5px 3px 3px;position:relative}
.b-arm-l,.b-arm-r{position:absolute;top:4px;width:6px;height:16px;background:#1565c0;border-radius:3px}
.b-arm-l{left:-5px;animation:bal 2.2s ease-in-out infinite}
.b-arm-r{right:-5px;animation:bar 2.2s ease-in-out infinite}
@keyframes bal{0%,100%{transform:rotate(12deg)}50%{transform:rotate(18deg)}}
@keyframes bar{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-20deg)}}
.b-legs{display:flex;justify-content:center;gap:2px;margin-top:1px}
.b-leg{width:8px;height:19px;background:#37474f;border-radius:0 0 4px 4px}
.b-shoe{width:10px;height:5px;background:#212121;border-radius:2px 5px 3px 3px}
.girl{position:relative;width:38px;height:74px;animation:gs 2.4s ease-in-out infinite}
@keyframes gs{0%,100%{transform:translateX(1.5px) rotate(.5deg)}50%{transform:translateX(-1.5px) rotate(-.5deg)}}
.g-head{width:17px;height:17px;background:linear-gradient(135deg,#ffe0b2,#ffcc80);border-radius:50%;margin:0 auto;position:relative;z-index:2}
.g-hair{position:absolute;top:-4px;left:-3px;width:23px;height:14px;background:#4e342e;border-radius:50% 50% 30% 30%;z-index:1}
.g-hair::after,.g-hair::before{content:'';position:absolute;top:9px;width:5px;height:14px;background:#4e342e;border-radius:0 0 3px 3px}
.g-hair::after{left:-1px;animation:hl 2.4s ease-in-out infinite}
.g-hair::before{right:-1px;animation:hr 2.4s ease-in-out infinite}
@keyframes hl{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes hr{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.g-eye-l,.g-eye-r{position:absolute;top:8px;width:2.5px;height:2.5px;background:#333;border-radius:50%}
.g-eye-l{left:4px}.g-eye-r{right:4px}
.g-blush-l,.g-blush-r{position:absolute;top:11px;width:4px;height:2.5px;background:rgba(255,138,128,.35);border-radius:50%}
.g-blush-l{left:1px}.g-blush-r{right:1px}
.g-dress{width:26px;height:30px;background:linear-gradient(180deg,#ec407a,#c2185b);margin:2px auto 0;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);position:relative}
.g-arm-l,.g-arm-r{position:absolute;top:3px;width:5px;height:14px;background:#ec407a;border-radius:3px}
.g-arm-l{left:-4px;animation:gal 2.4s ease-in-out infinite}
.g-arm-r{right:-4px;animation:gar 2.4s ease-in-out infinite}
@keyframes gal{0%,100%{transform:rotate(10deg)}50%{transform:rotate(16deg)}}
@keyframes gar{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-18deg)}}
.g-legs{display:flex;justify-content:center;gap:2px;margin-top:1px}
.g-leg{width:6px;height:15px;background:#ffcc80;border-radius:0 0 3px 3px}
.g-shoe{width:8px;height:4px;background:#e91e63;border-radius:2px 4px 2px 2px}
.teddy{position:relative;width:48px;height:52px;margin-left:6px;animation:tb 1.1s ease-in-out infinite}
@keyframes tb{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(-8px) scale(.96,1.06)}30%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-4px) scale(.98,1.03)}60%{transform:translateY(0) scale(1.03,.97)}75%{transform:translateY(-2px) scale(1,1.01)}}
.t-body{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:28px;height:24px;background:linear-gradient(160deg,#d4a574,#c4956a 50%,#b8865a);border-radius:50% 50% 48% 48%;box-shadow:inset -2px -3px 5px rgba(0,0,0,.1)}
.t-belly{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:16px;height:13px;background:#e8c9a0;border-radius:50%;z-index:1}
.t-head{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:24px;height:22px;background:linear-gradient(150deg,#d4a574,#c4956a);border-radius:50%;z-index:3;animation:th 3s ease-in-out infinite}
@keyframes th{0%,100%{transform:translateX(-50%) rotate(0)}30%{transform:translateX(-50%) rotate(4deg)}60%{transform:translateX(-50%) rotate(-3deg)}}
.t-ear{position:absolute;top:-2px;width:10px;height:10px;background:#a0714a;border-radius:50%;z-index:2}
.t-ear.l{left:8px;animation:el 1.8s ease-in-out infinite}
.t-ear.r{right:8px;animation:er 1.8s ease-in-out infinite .3s}
@keyframes el{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes er{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.t-ear::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;background:#8d5e3c;border-radius:50%}
.t-eye{position:absolute;top:8px;width:4px;height:4.5px;background:#111;border-radius:50%;z-index:4;animation:tbl 3.2s infinite}
.t-eye.l{left:14px}.t-eye.r{right:14px}
.t-eye::after{content:'';position:absolute;top:.5px;left:.5px;width:1.5px;height:1.5px;background:rgba(255,255,255,.7);border-radius:50%}
@keyframes tbl{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
.t-nose{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:5px;height:4px;background:#1a1a1a;border-radius:50%/40% 40% 60% 60%;z-index:4}
.t-mouth{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-bottom:1.5px solid #5d4037;border-radius:0 0 50% 50%;z-index:4}
.t-tongue{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:3px;height:0;background:#ff8a80;border-radius:0 0 50% 50%;z-index:4;animation:tp 4s ease-in-out infinite}
@keyframes tp{0%,70%,100%{height:0}75%,85%{height:3px}}
.t-paw-l,.t-paw-r{position:absolute;bottom:3px;width:8px;height:10px;background:#c9a06a;border-radius:40% 40% 50% 50%;z-index:2}
.t-paw-l{left:9px;animation:pl 1.1s ease-in-out infinite}
.t-paw-r{right:9px;animation:pr 1.1s ease-in-out infinite .1s}
@keyframes pl{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}}
@keyframes pr{0%,100%{transform:rotate(0)}30%{transform:rotate(6deg)}}
.t-paw-l::after,.t-paw-r::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:5px;height:4px;background:#8d5e3c;border-radius:50%}
.t-tail{position:absolute;bottom:14px;right:4px;width:9px;height:9px;background:#d4a574;border-radius:50%;z-index:1;animation:tw .5s ease-in-out infinite alternate;transform-origin:bottom left}
@keyframes tw{0%{transform:rotate(-25deg)}100%{transform:rotate(25deg)}}
.complete-overlay{position:fixed;inset:0;background:rgba(255,255,255,0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;pointer-events:none;transition:background 2s}
.complete-overlay.show{background:rgba(255,255,255,.9);pointer-events:auto}
.big-heart{font-size:clamp(50px,12vw,70px);opacity:0;transform:scale(0);transition:all .8s cubic-bezier(.34,1.56,.64,1)}
.big-heart.show{opacity:1;transform:scale(1)}
.msg{margin-top:15px;font-size:clamp(16px,4.5vw,26px);color:#d63384;text-align:center;line-height:2;opacity:0;transition:opacity 1s}
.msg.show{opacity:1}
.firework-particle{position:fixed;pointer-events:none;z-index:300;border-radius:50%;animation:fw 1s ease-out forwards}
@keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(.3);opacity:0}}
.ambient-petal{position:fixed;pointer-events:none;z-index:1;animation:pf linear forwards}
@keyframes pf{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translateY(110vh) translateX(30px) rotate(180deg);opacity:0}}
</style>
</head>
<body>
<div class="bg-orb" style="width:45vmin;height:45vmin;background:rgba(255,182,193,.4);top:-8%;left:-8%"></div>
<div class="bg-orb" style="width:38vmin;height:38vmin;background:rgba(255,228,235,.5);top:12%;right:-6%;animation-delay:-3s"></div>
<div class="bg-orb" style="width:32vmin;height:32vmin;background:rgba(230,210,255,.3);bottom:8%;left:8%;animation-delay:-5s"></div>
<div class="bg-orb" style="width:28vmin;height:28vmin;background:rgba(255,240,245,.5);top:38%;left:38%;animation-delay:-2s"></div>
<div class="header">
<div class="title">🌹 999朵玫瑰 · 七夕快乐 🌹</div>
<div class="tip">已送出：<span id="num">0</span> / 999 朵</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>
<div class="bouquet-wrap" id="bouquetWrap">
<div class="flower-ball" id="flowerBall"></div>
<div class="leaves">
<div class="leaf small" style="transform:rotate(-40deg)"></div>
<div class="leaf" style="transform:rotate(-28deg)"></div>
<div class="leaf" style="transform:rotate(-16deg)"></div>
<div class="leaf" style="transform:rotate(-5deg)"></div>
<div class="leaf" style="transform:rotate(0deg)"></div>
<div class="leaf" style="transform:rotate(5deg) scaleX(-1)"></div>
<div class="leaf" style="transform:rotate(16deg) scaleX(-1)"></div>
<div class="leaf" style="transform:rotate(28deg) scaleX(-1)"></div>
<div class="leaf small" style="transform:rotate(40deg) scaleX(-1)"></div>
</div>
<div class="paper-wrap" id="paperWrap">
<div class="bow"><div class="knot"></div><div class="ribbon-l"></div><div class="ribbon-r"></div></div>
</div>
</div>
<div class="end-text" id="endText"></div>
<div class="couple-section" id="coupleSection">
<div class="couple-container">
<div class="heart-between">💗</div>
<div class="boy">
<div class="b-head"><div class="b-hair"></div><div class="b-eye-l"></div><div class="b-eye-r"></div><div class="b-blush-l"></div><div class="b-blush-r"></div></div>
<div class="b-body"><div class="b-arm-l"></div><div class="b-arm-r"></div></div>
<div class="b-legs"><div><div class="b-leg"></div><div class="b-shoe"></div></div><div><div class="b-leg"></div><div class="b-shoe"></div></div></div>
</div>
<div class="girl">
<div class="g-head"><div class="g-hair"></div><div class="g-eye-l"></div><div class="g-eye-r"></div><div class="g-blush-l"></div><div class="g-blush-r"></div></div>
<div class="g-dress"><div class="g-arm-l"></div><div class="g-arm-r"></div></div>
<div class="g-legs"><div><div class="g-leg"></div><div class="g-shoe"></div></div><div><div class="g-leg"></div><div class="g-shoe"></div></div></div>
</div>
<div class="teddy">
<div class="t-ear l"></div><div class="t-ear r"></div>
<div class="t-head"><div class="t-eye l"></div><div class="t-eye r"></div><div class="t-nose"></div><div class="t-mouth"></div><div class="t-tongue"></div></div>
<div class="t-body"><div class="t-belly"></div></div>
<div class="t-paw-l"></div><div class="t-paw-r"></div>
<div class="t-tail"></div>
</div>
</div>
</div>
<div class="complete-overlay" id="completeOverlay">
<div class="big-heart" id="bigHeart">💝</div>
<div class="msg" id="completeMsg">999朵玫瑰已送达<br>愿你被这世界温柔以待<br>七夕快乐 ❤️</div>
</div>
<script>
$(function(){
var maxRose=600,total=0;
var numEl=document.getElementById('num');
var bar=document.getElementById('progressBar');
$('.title').delay(200).animate({opacity:1},600);
$('.tip').delay(500).animate({opacity:1},500);
$('.progress-wrap').delay(700).animate({opacity:1},500);
$('#bouquetWrap').delay(400).animate({opacity:1},800);
$('#coupleSection').delay(1000).animate({opacity:1},700);
function buildFlowerBall(){
var ball=document.getElementById('flowerBall');
var size=ball.offsetWidth||250;
var radius=size/2;
var ga=Math.PI*(3-Math.sqrt(5));
var pos=[];
for(var i=0;i<120;i++){
var r=(radius-6)*Math.sqrt(i/120);
var t=i*ga;
pos.push({x:radius+r*Math.cos(t),y:radius+r*Math.sin(t),d:r});
}
for(var j=0;j<24;j++){
var a=(j/24)*Math.PI*2;
pos.push({x:radius+(radius-9)*Math.cos(a),y:radius+(radius-9)*Math.sin(a),d:radius-9});
}
for(var k=0;k<16;k++){
var a2=(k/16)*Math.PI*2+.3;
pos.push({x:radius+(radius-6)*.55*Math.cos(a2),y:radius+(radius-6)*.55*Math.sin(a2),d:(radius-6)*.55});
}
pos.sort(function(a,b){return a.d-b.d});
var fs=Math.max(16,Math.floor(size/10));
var frag=document.createDocumentFragment();
var els=[];
pos.forEach(function(p){
var s=document.createElement('span');
s.className='rose-item';
s.textContent='🌹';
s.style.left=(p.x-fs/2)+'px';
s.style.top=(p.y-fs/2)+'px';
s.style.fontSize=fs+'px';
frag.appendChild(s);
els.push(s);
});
ball.appendChild(frag);
els.forEach(function(el,idx){
setTimeout(function(){el.classList.add('show')},600+idx*60);
});
var done=600+els.length*60+300;
setTimeout(function(){
var lv=document.querySelectorAll('.leaf');
for(var i=0;i<lv.length;i++){
(function(e,d){setTimeout(function(){e.classList.add('show')},d)})(lv[i],i*70);
}
},done);
setTimeout(function(){document.getElementById('paperWrap').classList.add('show')},done+500);
}
buildFlowerBall();
function createFallingRose(){
if(total>=maxRose)return;
var sz=14+Math.random()*14;
var sx=Math.random()*(window.innerWidth-30);
var dur=2+Math.random()*1.5;
var el=document.createElement('div');
el.className='falling-rose';
el.textContent='🌹';
el.style.left=sx+'px';
el.style.top='-35px';
el.style.fontSize=sz+'px';
el.style.animationDuration=dur+'s';
document.body.appendChild(el);
el.addEventListener('animationend',function(){el.remove()});
total++;
numEl.textContent=total;
bar.style.width=(total/maxRose*100)+'%';
if(total>=maxRose)onAllComplete();
}
var phase=0,gt=null;
function startGen(iv){
if(gt)clearInterval(gt);
gt=setInterval(function(){
if(total>=maxRose){clearInterval(gt);return}
createFallingRose();
if(phase===0&&total>250){phase=1;startGen(12)}
else if(phase===1&&total>600){phase=2;startGen(8)}
},iv);
}
startGen(18);
function onAllComplete(){
setTimeout(function(){typeWriter(document.getElementById('endText'),'💌 予你天长地久的偏爱，999朵玫瑰代表长长久久',70)},800);
setTimeout(function(){
document.getElementById('completeOverlay').classList.add('show');
setTimeout(function(){document.getElementById('bigHeart').classList.add('show')},300);
setTimeout(function(){document.getElementById('completeMsg').classList.add('show')},900);
launchFireworks();
},2500);
}
function launchFireworks(){
var colors=['#ff6b9d','#ffd700','#ff4757','#ff8fab','#e91e63','#ffb6c1','#ff69b4'];
for(var f=0;f<6;f++){
(function(fi){
setTimeout(function(){
var cx=Math.random()*window.innerWidth;
var cy=Math.random()*window.innerHeight*.5+50;
for(var i=0;i<20;i++){
var a=(i/20)*Math.PI*2;
var d=50+Math.random()*90;
var s=3+Math.random()*5;
var c=colors[Math.floor(Math.random()*colors.length)];
var p=document.createElement('div');
p.className='firework-particle';
p.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+s+'px;height:'+s+'px;background:'+c+';box-shadow:0 0 6px '+c;
p.style.setProperty('--fx',Math.cos(a)*d+'px');
p.style.setProperty('--fy',Math.sin(a)*d+'px');
document.body.appendChild(p);
p.addEventListener('animationend',function(){p.remove()});
}
},fi*500);
})(f);
}
}
document.addEventListener('click',function(e){
var x=e.clientX,y=e.clientY;
var em=['💕','💗','💖','❤️','🌹','✨','💘'];
for(var i=0;i<8;i++){
var a=(i/8)*Math.PI*2;
var d=35+Math.random()*55;
var h=document.createElement('div');
h.className='click-heart';
h.textContent=em[Math.floor(Math.random()*em.length)];
h.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+(10+Math.random()*14)+'px';
h.style.setProperty('--dx',Math.cos(a)*d+'px');
h.style.setProperty('--dy',(Math.sin(a)*d-25)+'px');
document.body.appendChild(h);
h.addEventListener('animationend',function(){h.remove()});
}
});
var lt=0;
document.addEventListener('mousemove',function(e){
var now=Date.now();
if(now-lt<100)return;
lt=now;
var tr=['💕','✨','💗','·'];
var t=document.createElement('div');
t.className='cursor-trail';
t.textContent=tr[Math.floor(Math.random()*tr.length)];
t.style.cssText='left:'+(e.clientX+(Math.random()-.5)*16)+'px;top:'+(e.clientY+(Math.random()-.5)*16)+'px;font-size:'+(7+Math.random()*8)+'px';
document.body.appendChild(t);
t.addEventListener('animationend',function(){t.remove()});
});
function createPetal(){
var pts=['🌸','💮','🩷','✿','❀'];
var p=document.createElement('div');
p.className='ambient-petal';
p.textContent=pts[Math.floor(Math.random()*pts.length)];
p.style.cssText='left:'+(Math.random()*100)+'%;top:-20px;font-size:'+(7+Math.random()*9)+'px;animation-duration:'+(9+Math.random()*5)+'s';
document.body.appendChild(p);
p.addEventListener('animationend',function(){p.remove()});
}
setInterval(createPetal,2500);
for(var i=0;i<4;i++)setTimeout(createPetal,i*600);
function typeWriter(el,text,sp){
var i=0;el.style.opacity=1;
var t=setInterval(function(){
if(i<text.length){el.textContent+=text[i];i++}
else clearInterval(t);
},sp);
}
});
</script>
</body>
</html>
